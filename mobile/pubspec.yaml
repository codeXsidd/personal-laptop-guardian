name: laptop_guardian
description: Personal Laptop Guardian - Monitor your Windows laptop and Android phone.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  timeago: ^3.7.0
  fl_chart: ^0.70.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^19.0.0
  window_manager: ^0.4.3
  tray_manager: ^0.2.3
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  flutter_webrtc: ^1.6.2+hotfix.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
